[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchbasictool"
version = "0.1.0"
description = "Reusable network-device client library for SSH/Telnet switch automation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.4,<5",
]

[project.scripts]
switchbasictool-manual-test = "switchbasictool.manual_test:main"

[tool.setuptools.packages.find]
include = ["switchbasictool*"]
